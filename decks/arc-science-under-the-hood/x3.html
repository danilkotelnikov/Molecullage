<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
/* x3: 3D stages in the deck style. A stage is a transparent WebGL canvas with studio light,
   a soft floor shadow, labels with leader lines, and drag to turn the object. */
.x3s{width:100%;display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1.38fr);gap:2.6vw;align-items:center}
.x3s .mh{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:2vh}
.x3s .mh h2{font-size:clamp(30px,3vw,52px);margin:0;line-height:1.05}
.x3s .tag{font:400 clamp(12px,.9vw,14px) "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);border:1px solid rgba(236,236,234,.22);border-radius:999px;padding:4px 12px}
.x3s .lede{font-size:clamp(16px,1.25vw,21px);color:var(--soft);line-height:1.45;margin:0 0 2vh}
.x3s .lede b{color:var(--fg);font-weight:600}
.x3s .facts{display:flex;flex-direction:column;gap:1.2vh;margin:0;padding:0;list-style:none}
.x3s .facts li{font-size:clamp(14px,1.05vw,18px);color:var(--soft);line-height:1.4;padding-left:16px;position:relative}
.x3s .facts li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--c,var(--teal))}
.x3s .facts li b{color:var(--fg);font-weight:600}
.x3s .eqmini{margin-top:2vh;font-size:clamp(16px,1.3vw,22px);color:var(--fg)}
.x3s .eqmini .cap{display:block;font-size:clamp(13px,.95vw,16px);color:var(--mute);margin-top:4px}
.x3{position:relative;width:100%;height:74vh;touch-action:pan-y;cursor:grab}
.x3:active{cursor:grabbing}
.x3 canvas{display:block;width:100%;height:100%;-webkit-mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 7%,#000 93%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 7%,#000 93%,transparent);mask-composite:intersect}
.x3 svg.lead{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.x3 .lb{position:absolute;transform:translate(-50%,-50%);font:500 14px "Geist Mono",monospace;letter-spacing:.04em;color:var(--fg);background:rgba(11,11,13,.78);border:1px solid rgba(236,236,234,.22);border-radius:6px;padding:3px 9px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .35s}
.x3 .lb.on{opacity:1}
.x3 .lb.glow{box-shadow:0 0 14px 1px var(--gc,rgba(127,178,170,.5)),inset 0 0 0 1px var(--gc,rgba(127,178,170,.5))}
.x3 .lb i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:0}
.x3 .hud{position:absolute;left:0;bottom:0;font:500 14px "Geist Mono",monospace;color:var(--mute);letter-spacing:.06em}
.x3 .gl-off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:15px}
@media (max-width:760px){
  .x3s{grid-template-columns:1fr;gap:8px}
  .x3s .mh h2{font-size:clamp(22px,6.4vw,28px)}
  .x3s .lede{font-size:14px;margin-bottom:6px}
  .x3s .facts{display:none}
  .x3s .eqmini{display:none}
  .x3{height:46vh}
  .x3 .lb{font-size:11px;padding:2px 6px}
}
</style>
