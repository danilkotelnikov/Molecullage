html,body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.page{padding:0;display:inline-block}
.card{position:absolute;border-width:1pt;border-style:solid;border-radius:.6mm;padding:1.8mm 2.2mm;display:flex;gap:2mm;align-items:center;overflow:hidden}
.card .tx{min-width:0}
.card .tx.center{width:100%;text-align:center}
.card .t{font-size:var(--fs-title);font-weight:700;line-height:1.2;margin:0;color:var(--ink)}
.card .s{font-size:var(--fs-label);line-height:1.2;margin:.4mm 0 0;color:var(--sub)}
.chip{flex:none;width:6.4mm;height:6.4mm;border-radius:50%;background:#fff;border:.6pt solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:11pt;color:var(--edge)}
.ic{display:inline-flex}.ic svg{display:block}
.dashed{border-style:dashed}
.card.stack{flex-direction:column;align-items:flex-start;justify-content:center;gap:.9mm}
.card .head{display:flex;gap:1.8mm;align-items:center}
.card.stack .chip{width:5mm;height:5mm;font-size:9pt}
.route{fill:none;stroke:var(--line);stroke-width:.3;stroke-linecap:butt;stroke-linejoin:miter}
.route.dashed{stroke-dasharray:1.0 .7}
.route.nohead{marker-end:none}
.dot{fill:var(--line)}
.node{fill:#fff;stroke:var(--line);stroke-width:.3}
.mark{fill:none;stroke:var(--line);stroke-width:.3}
.lab{position:absolute;white-space:pre;line-height:1.15}
.sw{position:absolute;width:3.8mm;height:3mm;border-width:1pt;border-style:solid;border-radius:.6mm}
.card.tile{flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:.8mm;padding:1.2mm 1mm}
.card.tile .s{margin:0}
.ic.big{font-size:15pt;color:var(--ink)}
.group{position:absolute;border:.8pt solid var(--rule);border-radius:2mm}
.group .gt{position:absolute;left:2mm;top:-1.9mm;background:#fff;padding:0 1mm;font-size:var(--fs-title);font-weight:700;color:var(--ink)}
.tensor{position:absolute;display:flex;border:.4pt solid var(--rule);overflow:hidden}
.tensor i{flex:1;display:block}
.card.plain{align-items:center;gap:2.2mm;padding:1.6mm 2.4mm}
.band{position:absolute;display:flex;align-items:center;gap:2.2mm;padding:0 5mm 0 2.4mm;border:0;clip-path:polygon(0 0,calc(100% - 2.6mm) 0,100% 50%,calc(100% - 2.6mm) 100%,0 100%)}
.band b{font-size:var(--fs-title);font-weight:700;color:var(--ink)}.band span{font-size:var(--fs-floor);font-style:italic;color:var(--sub)}
.band.dashed{background:#F2F2F2!important}
.letter{position:absolute;display:flex;align-items:center;gap:1.2mm;line-height:1}
.letter b{font-size:var(--fs-letter);font-weight:700;color:var(--ink)}
.letter .mk{font-size:8.5pt;color:var(--sub)}
.chipbox{position:absolute;display:flex;align-items:center;justify-content:center;border:.8pt solid var(--edge);border-radius:.8mm;color:var(--ink)}
.picto{position:absolute;color:var(--ink);display:flex;align-items:center;justify-content:center}
.tbox{position:absolute;line-height:1.25}
.plots svg{display:block}
.group.dashed{border-style:dashed;background:transparent!important}
.card.fam-full,.card.dashed{border-style:dashed}
.sw.dashed,.sw.fam-full{border-style:dashed}
.art{position:absolute;display:block}
.mth{font-family:Arial,Helvetica,sans-serif;white-space:pre}
.mth i{font-style:italic}.mth .up{font-style:normal}
.mth sub,.mth sup{font-size:.78em;line-height:0;position:relative;vertical-align:baseline}
.mth sub{top:.28em}.mth sup{top:-.42em}
.state{position:absolute;border:1pt solid var(--rule);border-radius:1.2mm;background:#fff}
.state.dashed{border-style:dashed}
.state .st{position:absolute;left:1.8mm;top:1.3mm;font-size:var(--fs-title);font-weight:700;line-height:1.15;color:var(--ink);white-space:pre}
.card.tool{padding:1mm 1.6mm;border-radius:1mm}
.card.tool .t{font-size:var(--fs-title)}.card.tool .s{font-size:var(--fs-label);margin:.3mm 0 0}.card.tool .rep{font-weight:400}

.pill em{font-style:normal;font-size:var(--fs-floor);color:var(--sub)}

.stage i{font-style:normal;font-weight:400;font-size:var(--fs-floor)}
.badge{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;border-width:.8pt;border-style:solid;font-weight:700;line-height:1}
.bar{position:absolute;border:.8pt solid var(--rule);border-radius:.4mm;background:#fff;overflow:hidden}
.bar i{display:block;height:100%}

.cell{position:absolute;box-sizing:border-box}
.fig{position:relative}

<script>
// Redesign of Figs 3A, 4A and 4B of Cuevas Zuviria et al. 2025, eLife 14:RP105613. src/make_layer.py draws the tree, the clade bands, the trait matrix, the event discs, the numbered
// rings and the clade bars as one SVG layer and writes every position this page needs to window.DATA (millimetres, origin top-left). This page writes the text, places the three
// ChimeraX renders, draws the leaders, and measures the rendered page at the end (checks.js): checkAlign() throws one Error that lists every position off its grid line.
const D = window.DATA, W = D.W, H = D.H, TOL = 0.25;
const f = new Fig(document.getElementById('fig'), W, H, { svgTop: true });
const Tp = (t) => H - t;
const INK = '#0A0A0A', SUB = '#2B2B2B', RULE = '#3A3A3A', EVENT = D.colors.event, FL = (window.CONFIG || {}).floorPt || 6.55;
const REC = {};            // text elements (checked for text on text and for the page edge)
const EL = {};             // other elements the checks measure
const R = (name, x, t, s, o = {}) => { const el = f.rich(x, Tp(t), s, { color: INK, fs: 7, ...o }); if (name) REC[name] = el; return el; };
const X0 = D.X0, Y0 = D.Y0, Y1 = D.Y1, P = D.P, RX = D.RX;
const TITLE_DX = 4.6, TITLE_DT = 2.2, SUB_DT = [5.8, 9.0, 12.2];
const MINUS = '−';
const fmtInt = (v) => Math.round(v).toLocaleString('en-US');
const fmtC = (v) => (Number.isInteger(v) ? v.toLocaleString('en-US') : v.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }));
const fmtG = (v) => (v < 0 ? MINUS : '') + Math.abs(v).toFixed(1);
const txt = (s) => s.replace(/^-/, MINUS);
const box = (cls, css, html = '') => { const d = document.createElement('div'); d.className = cls; d.style.cssText = css; d.innerHTML = html; f.el.appendChild(d); return d; };
// glyphs: a white ring (with its number written on it) and an indigo disc (with its letter); (x, t) is the centre, millimetres from the top
const ring = (id, x, t, n, r = 1.25) => { box('rg', `position:absolute;left:${x - r}mm;top:${t - r}mm;width:${2 * r}mm;height:${2 * r}mm;border-radius:50%;background:#fff;border:0.25mm solid ${INK}`).id = id; R(id + '-n', x, t, String(n), { ha: 'center', bold: true, fs: FL, color: INK }); };
const disc = (id, x, t, letter, r = D.disc_r) => { box('dc', `position:absolute;left:${x - r}mm;top:${t - r}mm;width:${2 * r}mm;height:${2 * r}mm;border-radius:50%;background:${EVENT};border:0.25mm solid #fff`).id = id; R(id + '-n', x, t, letter, { ha: 'center', bold: true, fs: FL, color: '#FFFFFF' }); };

const head = (ch, x, T, title, subs) => {
  f.letter(ch, x, Tp(T + 0.6));
  R('title-' + ch, x + TITLE_DX, T + TITLE_DT, title, { bold: true, fs: 7.5 });
  subs.forEach((s, k) => R(`sub${k + 1}-${ch}`, x + TITLE_DX, T + SUB_DT[k], s, { color: SUB, fs: 7, mfs: 7 }));
};

// ---------------------------------------------------------------- panel a: tree and traits
const T0 = 1.5;
head('a', X0, T0, 'Nitrogenase family tree, with traits', [
  '385 living proteins, 384 reconstructed ancestors. Darker bands: Vnf and Anf inside Nif-III.',
  'Nif, Vnf, Anf: nitrogenases using molybdenum, vanadium, or only iron. I to III: Nif clades.',
  'Anf sits inside Vnf. D, K: subunits of the enzyme core. Branch lengths are to scale.']);
['Dashed stub (left edge of tree):', 'root branch to 385 outgroup', 'sequences (not drawn).'].forEach((s, k) => R('root' + (k + 1), D.LBAR_X + D.LBAR_W + 1.6, Y0 - 10.4 + 2.9 * k, s, { fs: FL, color: SUB }));
// matrix header: title, one legend for the three columns, names, units, colour bars and their end numbers
const C = D.cols;
R('mh1', C[0].x, Y0 - 23.0, 'Predicted core (2 D, 2 K)', { bold: true, fs: 7 });
R('mh2', C[0].x, Y0 - 20.0, 'AlphaFold2 predictions, one row per living protein', { fs: FL, color: SUB });
R('lg1', C[0].x, Y0 - 17.0, 'Lighter to darker: smaller to larger (area, contacts).', { fs: FL, color: INK });
R('lg2', C[0].x, Y0 - 14.0, 'ΔG, predicted binding energy: less to more stable.', { fs: FL, color: INK });
C.forEach((c, k) => {
  R('cn-' + k, c.x + c.w / 2, Y0 - 10.6, c.name, { ha: 'center', fs: FL, color: INK });
  R('cu-' + k, c.x + c.w / 2, Y0 - 7.8, '(' + c.unit + ')', { ha: 'center', fs: FL, color: SUB });
  const left = c.invert ? c.hi : c.lo, right = c.invert ? c.lo : c.hi;       // light end left, dark end right (for ΔG the light end is the highest value)
  R('kl-' + k, c.x, Y0 - 2.1, txt(left), { ha: 'left', fs: FL, color: SUB });
  R('kr-' + k, c.x + c.w, Y0 - 2.1, txt(right), { ha: 'right', fs: FL, color: SUB });
});
// clade names on the left strips, turned
const GN = { 'nif-iii': 'Nif-III', Vnf: 'Vnf', Anf: 'Anf', 'nif-i': 'Nif-I', 'nif-ii': 'Nif-II' };
Object.entries(D.blocks).forEach(([g, b]) => R('bar-' + g, D.LBAR_X + D.LBAR_W / 2, (b.top + b.bottom) / 2, GN[g], { ha: 'center', rot: true, bold: true, fs: FL, color: b.text }));
// numbered rings at the tips and at the ends of their rows
D.rings.forEach((r) => { ring('ringt-' + r.n, r.xt, r.y, r.n); ring('ringm-' + r.n, D.RING_X, r.y, r.n); });
// event discs and the clade each belongs to
D.events.forEach((e) => { disc('disc-' + e.key, e.xm, e.y + e.dy, e.letter); R('evlab-' + e.key, e.label.x, e.label.t + e.label.h / 2, e.label.text, { fs: FL, color: INK }); });
// scale bar below the tree: 0.5 substitutions per site, from the root edge
const SB = 0.5 * D.S, SBY = Y1 + 3.4;
f.route([[D.XR, Tp(SBY)], [D.XR + SB, Tp(SBY)]], { head: false, width: 0.35 }); EL.sbar = f.svg.lastElementChild;
f.route([[D.XR, Tp(SBY - 0.9)], [D.XR, Tp(SBY + 0.9)]], { head: false, width: 0.35 }); EL.sbar0 = f.svg.lastElementChild;
f.route([[D.XR + SB, Tp(SBY - 0.9)], [D.XR + SB, Tp(SBY + 0.9)]], { head: false, width: 0.35 }); EL.sbar1 = f.svg.lastElementChild;
R('scale', D.XR + SB + 1.6, SBY, '0.5 amino-acid substitutions per site', { fs: FL, color: INK });

// ---------------------------------------------------------------- panel b: three insertions in deposited structures
head('b', RX, T0, 'Three insertions in deposited structures', [
  'The enzyme core holds two D and two K subunits.',
  'Pictures: X-ray entries of the Protein Data Bank (PDB).']);
const KEY_T = T0 + 12.2;
const SW = [[D.colors.D, 'D subunit'], [D.colors.K, 'K subunit'], [EVENT, 'inserted segment']];
let kx = RX + 4.6;
SW.forEach(([c, t], i) => {
  box('sw', `left:${kx}mm;top:${KEY_T - 1.5}mm;width:3.8mm;height:3mm;background:${c};border:0.6pt solid #0A0A0A;border-radius:0.6mm`).id = 'keysw-' + i;
  R('keyt-' + i, kx + 5.0, KEY_T, t, { fs: FL, color: INK });
  kx += 5.0 + (t.length * 1.07) + 3.2;
});
// what the marks mean (one place, panel b header)
const MT = RX + 5.0;
ring('mk-ring', RX + 2.4, 18.2, 1);
R('mk-0', MT, 18.2, 'Ring and number: the tip whose entry is shown below.', { fs: FL, color: INK });
disc('mk-disc', RX + 2.4, 21.4, 'D');
R('mk-1', MT, 21.4, 'D or K on a thick blue branch: where the paper', { fs: FL, color: INK });
R('mk-2', MT, 24.3, 'places that insertion; the clade is named beside it.', { fs: FL, color: INK });
R('mk-3', MT, 27.2, 'K appears first, then lengthens later.', { fs: FL, color: INK });
R('mk-4', MT, 30.7, 'Residues: computed here; “Paper says”: the paper’s value.', { fs: FL, color: INK });
// insets
const SH = 40.6, SG = 4.55, RW = 40.0;
const GAPC = { 'nif-i': 'Nif-I clade', 'nif-ii': 'Nif-II clade', Anf: 'Anf clade' };
const LINES = { K: ['K-subunit', 'N-terminal', 'extension'], D_nif2: ['D-subunit', 'insertion'], D_anf: ['D-subunit', 'C-terminal', 'extension'] };
const PAPER = { K: 'about 8 to 40', nif2: 'about 55', anf: 'about 60' };
const slotTop = (i) => Y0 + i * (SH + SG);
D.insets.forEach((ins, i) => {
  const top = slotTop(i), b = D.blocks[ins.group], key = ins.pdb;

    for (let j = 0; j < 8; j++) near(m[`tv-${i}-${j}`].cy, m['tl-' + i].cy, `table: row ${i + 1} value ${j + 1} on the row`, 0.3);
    TFILL[D.table[i].key].forEach((c, k) => { const sw = M(document.getElementById(`tsw-${i}-${k}`)); near(sw.cy, TR0 + TRP * i, `table: swatch ${i + 1}.${k + 1} on its row`, 0.2); near(sw.l, X0 + k * 2.4, `table: swatch ${i + 1}.${k + 1} x`, 0.1); });
  }
  GROUPS.forEach(([t, j], g) => { const e = m['th-' + g]; near(e.cy, m['th-0'].cy, `table: group header ${g + 1} on one row`, 0.25); if (!(e.l >= (g ? CRX[j - 1] : 20) && e.r <= CRX[j + 1] + 0.2)) fails.push(`table: group header ${g + 1} off its column pair`); });
  { const tl = D.table.map((r, i) => [r, m['tl-' + i].l]); const first = tl[0][1]; tl.filter(([r]) => r.key !== 'an').forEach(([r, l]) => near(l, first, 'table: row labels on one edge')); }
  for (let j = 2; j < 8; j += 2) near(CRX[j + 1] - CRX[j], CRX[1] - CRX[0], `table: pair width ${j / 2 + 1}`, 0.01);
  near(m['hr-h'].l, NX, 'notes heading on the notes column'); for (let k = 0; k < 5; k++) { near(m['hr-' + k].l, NX, `notes line ${k + 1} on the column`); if (!(m['hr-' + k].r <= W - X0)) fails.push('notes line ' + (k + 1) + ' runs past the page edge'); }
  { const rr = Math.max(...D.table.map((r, i) => m['tv-' + i + '-7'].r)); if (!(NX - rr >= 5)) fails.push('notes column too close to the table'); }
  // 9. text on text, text inside the page, text off the strips, bars and the matrix
  const T = Object.entries(REC).map(([k, el]) => [k, M(el)]);
  for (let i = 0; i < T.length; i++) for (let j = i + 1; j < T.length; j++) {
    const a = T[i][1], b = T[j][1], pad = 0.08;
    if (a.l + pad < b.r && b.l + pad < a.r && a.t + pad < b.b && b.t + pad < a.b) fails.push(`text on text: ${T[i][0]} and ${T[j][0]}`);
    // on one row, texts keep 0.7 mm apart (a tight gap reads as one line)
    const ov = Math.min(a.b, b.b) - Math.max(a.t, b.t);
    if (ov > 0.5 * Math.min(a.h, b.h) && !(a.l + pad < b.r && b.l + pad < a.r) && Math.max(a.l - b.r, b.l - a.r) < 0.7) fails.push(`texts closer than 0.7 mm on one row: ${T[i][0]} and ${T[j][0]} (${Math.max(a.l - b.r, b.l - a.r).toFixed(2)})`);
  }
  T.forEach(([k, e]) => { if (e.l < 1.0 || e.t < 1.0 || e.r > W - 1.0 || e.b > H - 0.8) fails.push(`text too near the page edge: ${k} (${e.l.toFixed(2)}, ${e.t.toFixed(2)}, ${e.r.toFixed(2)}, ${e.b.toFixed(2)})`); });
  T.forEach(([k, e]) => {
    if (/^bar-/.test(k) || /-n$/.test(k) || /^lt-/.test(k)) return;
    Object.values(D.blocks).forEach((b) => {
      if (e.l < D.LBAR_X + D.LBAR_W && e.r > D.LBAR_X && e.t < b.bottom && e.b > b.top) fails.push(`text ${k} sits on a clade strip`);
      if (e.l < D.BAR_X + D.BAR_W && e.r > D.BAR_X && e.t < b.bottom && e.b > b.top) fails.push(`text ${k} sits on a clade bar`);
    });
    if (e.l < MEND && e.r > D.cols[0].x && e.t < Y1 && e.b > Y0) fails.push(`text ${k} sits on the matrix`);
  });
  if (fails.length) throw new Error('alignment, tolerance ' + TOL + ' mm: ' + fails.join('; '));
}
checkAlign();
