<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Storyboard — miraeles</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      width: 1920px;
      box-sizing: border-box;
      background: #FFFFFF;
      color: #0A0A0A;
      font-family: Arial, Arial, sans-serif;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .cell {
      margin: 0;
      border: 1px solid #0A0A0A33;
      padding: 12px;
    }
    .cell img {
      width: 100%;
      height: auto;
      display: block;
    }
    .meta {
      margin-top: 8px;
    }
    .stop-index {
      font-size: 13px;
      opacity: 0.7;
    }
    .title-en {
      font-weight: 700;
      font-size: 18px;
      margin-top: 4px;
    }
    .title-ru {
      font-size: 15px;
      opacity: 0.8;
    }
    .say {
      font-size: 14px;
      line-height: 1.4;
      margin: 6px 0 0;
    }
  </style>
</head>
<body>
  <div class="grid">
    <figure class="cell">
      <img src="stop-00.png" alt="Stop 0" />
      <figcaption class="meta">
        <div class="stop-index">1 · t = 0.0s</div>
        <div class="title-en">Miraeles</div>
        <div class="title-ru">Miraeles</div>
        <p class="say">Miraeles is a field DNA kit for checking plant and farm samples without shipping tubes to a central laboratory.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-01.png" alt="Stop 1" />
      <figcaption class="meta">
        <div class="stop-index">2 · t = 6.0s</div>
        <div class="title-en">Hidden infection in leaf tissue</div>
        <div class="title-ru">Скрытая инфекция в ткани листа</div>
        <p class="say">Fungal mycelium spreads inside green leaf tissue days before visible lesions appear on the crop.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-02.png" alt="Stop 2" />
      <figcaption class="meta">
        <div class="stop-index">3 · t = 12.0s</div>
        <div class="title-en">Complete kit in order of use</div>
        <div class="title-ru">Весь набор по порядку работы</div>
        <p class="say">Every run uses four modules in sequence: sample lysis tube, thermos bath, MIRA reaction tube and closed strip reader.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-03.png" alt="Stop 3" />
      <figcaption class="meta">
        <div class="stop-index">4 · t = 18.0s</div>
        <div class="title-en">Alkaline lysis without a centrifuge</div>
        <div class="title-ru">Щелочной лизис без центрифуги</div>
        <p class="say">Crushed leaf tissue in alkaline buffer releases template DNA in 5 minutes, inside a total on-site window under 25 minutes.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-04.png" alt="Stop 4" />
      <figcaption class="meta">
        <div class="stop-index">5 · t = 24.0s</div>
        <div class="title-en">Paraffin bath inside the thermos</div>
        <div class="title-ru">Парафиновая баня в термосе</div>
        <p class="say">A 300 mL thermos holds 150 to 200 grams of food-grade paraffin wax melting at 40 to 41 C without batteries.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-05.png" alt="Stop 5" />
      <figcaption class="meta">
        <div class="stop-index">6 · t = 30.0s</div>
        <div class="title-en">Simulated cooling window</div>
        <div class="title-ru">Расчетное окно остывания</div>
        <p class="say">In -10 C air, the 3D thermal model holds 39 to 42 C for 42 minutes at 0.097 W/K cap loss and 19 minutes at 0.188 W/K.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-06.png" alt="Stop 6" />
      <figcaption class="meta">
        <div class="stop-index">7 · t = 36.0s</div>
        <div class="title-en">Isothermal amplification in the drop</div>
        <div class="title-ru">Изотермическая амплификация в капле</div>
        <p class="say">At 37 to 42 C, recombinase and polymerase enzymes multiply the target DNA segment into dual-tagged duplex copies.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-07.png" alt="Stop 7" />
      <figcaption class="meta">
        <div class="stop-index">8 · t = 42.0s</div>
        <div class="title-en">Whole binding sandwich at true scale</div>
        <div class="title-ru">Полный комплекс связывания в масштабе</div>
        <p class="say">A 40 nm gold particle, anti-FAM IgG PDB 1IGT, FAM-DNA-biotin duplex and capture binder form one physical bridge.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-08.png" alt="Stop 8" />
      <figcaption class="meta">
        <div class="stop-index">9 · t = 48.0s</div>
        <div class="title-en">Closed transfer and line capture</div>
        <div class="title-ru">Закрытый перенос и захват на линиях</div>
        <p class="say">A sealed pin cassette transfers 74% of fluid in the model after 10 squeezes, capturing bridged gold at the test line.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-09.png" alt="Stop 9" />
      <figcaption class="meta">
        <div class="stop-index">10 · t = 54.0s</div>
        <div class="title-en">Visual strip readout rules</div>
        <div class="title-ru">Правила чтения полоски</div>
        <p class="say">Two coloured lines show target DNA, one control line shows a negative sample, and zero control lines reject the strip.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-10.png" alt="Stop 10" />
      <figcaption class="meta">
        <div class="stop-index">11 · t = 60.0s</div>
        <div class="title-en">Target disposable cost</div>
        <div class="title-ru">Целевая стоимость расходников</div>
        <p class="say">Quoted disposable parts sum to 13.4 to 32.8 rubles across 6 operator steps against a 100-ruble per-test ceiling.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-11.png" alt="Stop 11" />
      <figcaption class="meta">
        <div class="stop-index">12 · t = 66.0s</div>
        <div class="title-en">Current state and next checks</div>
        <div class="title-ru">Текущий статус и следующие проверки</div>
        <p class="say">Thermal simulation, pin geometry and 3 in silico panels exist; wet-lab checks E1, E4 and E7 come next.</p>
      </figcaption>
    </figure>
  </div>
</body>
</html>
