<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Storyboard — miraeles</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      width: 1920px;
      box-sizing: border-box;
      background: #FFFFFF;
      color: #0A0A0A;
      font-family: Arial, Arial, sans-serif;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .cell {
      margin: 0;
      border: 1px solid #0A0A0A33;
      padding: 12px;
    }
    .cell img {
      width: 100%;
      height: auto;
      display: block;
    }
    .meta {
      margin-top: 8px;
    }
    .stop-index {
      font-size: 13px;
      opacity: 0.7;
    }
    .title-en {
      font-weight: 700;
      font-size: 18px;
      margin-top: 4px;
    }
    .title-ru {
      font-size: 15px;
      opacity: 0.8;
    }
    .say {
      font-size: 14px;
      line-height: 1.4;
      margin: 6px 0 0;
    }
  </style>
</head>
<body>
  <div class="grid">
    <figure class="cell">
      <img src="stop-00.png" alt="Stop 0" />
      <figcaption class="meta">
        <div class="stop-index">1 · t = 0.0s</div>
        <div class="title-en">Miraeles</div>
        <div class="title-ru">Miraeles</div>
        <p class="say">Miraeles is a field nucleic-acid kit for detecting plant fungal pathogens on the farm.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-01.png" alt="Stop 1" />
      <figcaption class="meta">
        <div class="stop-index">2 · t = 6.0s</div>
        <div class="title-en">Hidden infection in leaf tissue</div>
        <div class="title-ru">Скрытая инфекция в ткани листа</div>
        <p class="say">Fungal mycelium spreads inside the leaf days before spots appear to the eye.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-02.png" alt="Stop 2" />
      <figcaption class="meta">
        <div class="stop-index">3 · t = 12.0s</div>
        <div class="title-en">The complete kit in order of use</div>
        <div class="title-ru">Весь набор по порядку работы</div>
        <p class="say">Every kit holds five parts in order: pestle, lysis tube, thermos bath, reaction tube and strip.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-03.png" alt="Stop 3" />
      <figcaption class="meta">
        <div class="stop-index">4 · t = 18.0s</div>
        <div class="title-en">Crude DNA lysis without a centrifuge</div>
        <div class="title-ru">Щелочной лизис без центрифуги</div>
        <p class="say">Crushed leaf tissue in alkaline buffer releases template DNA in 5 minutes on the bench.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-04.png" alt="Stop 4" />
      <figcaption class="meta">
        <div class="stop-index">5 · t = 24.0s</div>
        <div class="title-en">Warm water bath inside the thermos</div>
        <div class="title-ru">Теплая водяная баня в термосе</div>
        <p class="say">A 300 mL insulated thermos holds the reaction tube in warm water without batteries or mains power.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-05.png" alt="Stop 5" />
      <figcaption class="meta">
        <div class="stop-index">6 · t = 30.0s</div>
        <div class="title-en">Simulated temperature curve</div>
        <div class="title-ru">Расчетная кривая остывания</div>
        <p class="say">In the 3-node thermal model, water starting at 42 C stays at 38.7 C after 20 minutes in 15 C air.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-06.png" alt="Stop 6" />
      <figcaption class="meta">
        <div class="stop-index">7 · t = 36.0s</div>
        <div class="title-en">Isothermal amplification in the drop</div>
        <div class="title-ru">Изотермическая амплификация в капле</div>
        <p class="say">Inside the liquid at 37 to 42 C, recombinase enzymes copy target DNA into tagged strands over 20 minutes.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-07.png" alt="Stop 7" />
      <figcaption class="meta">
        <div class="stop-index">8 · t = 42.0s</div>
        <div class="title-en">Whole binding sandwich at true scale</div>
        <div class="title-ru">Полный комплекс связывания в масштабе</div>
        <p class="say">Both binders, both end tags, the DNA duplex between them and the 40 nm gold particle form one bridge.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-08.png" alt="Stop 8" />
      <figcaption class="meta">
        <div class="stop-index">9 · t = 48.0s</div>
        <div class="title-en">Test line and control line capture</div>
        <div class="title-ru">Захват на тестовой и контрольной линиях</div>
        <p class="say">Bridged gold stops at the test line, while unbound antibody gold continues to the control line.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-09.png" alt="Stop 9" />
      <figcaption class="meta">
        <div class="stop-index">10 · t = 54.0s</div>
        <div class="title-en">Visual strip readout rules</div>
        <div class="title-ru">Правила чтения полоски</div>
        <p class="say">Two coloured lines show target DNA; one control line shows a clean leaf; no control line rejects the run.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-10.png" alt="Stop 10" />
      <figcaption class="meta">
        <div class="stop-index">11 · t = 60.0s</div>
        <div class="title-en">Target unit economics</div>
        <div class="title-ru">Целевая экономика одного теста</div>
        <p class="say">The target bill of materials is 220 to 350 rubles per disposable tube and lateral-flow strip.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-11.png" alt="Stop 11" />
      <figcaption class="meta">
        <div class="stop-index">12 · t = 66.0s</div>
        <div class="title-en">Current state and pilot verification</div>
        <div class="title-ru">Текущий статус и план проверки</div>
        <p class="say">Thermal simulation and primer code are built; wet-lab sensitivity and field trials are the next two steps.</p>
      </figcaption>
    </figure>
  </div>
</body>
</html>
