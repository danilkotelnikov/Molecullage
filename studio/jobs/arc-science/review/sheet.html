<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Storyboard — arc-science</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      width: 1920px;
      box-sizing: border-box;
      background: #FFFFFF;
      color: #0A0A0A;
      font-family: Arial, Arial, sans-serif;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .cell {
      margin: 0;
      border: 1px solid #0A0A0A33;
      padding: 12px;
    }
    .cell img {
      width: 100%;
      height: auto;
      display: block;
    }
    .meta {
      margin-top: 8px;
    }
    .stop-index {
      font-size: 13px;
      opacity: 0.7;
    }
    .title-en {
      font-weight: 700;
      font-size: 18px;
      margin-top: 4px;
    }
    .title-ru {
      font-size: 15px;
      opacity: 0.8;
    }
    .say {
      font-size: 14px;
      line-height: 1.4;
      margin: 6px 0 0;
    }
  </style>
</head>
<body>
  <div class="grid">
    <figure class="cell">
      <img src="stop-00.png" alt="Stop 0" />
      <figcaption class="meta">
        <div class="stop-index">1 · t = 0.0s</div>
        <div class="title-en">Arc Science</div>
        <div class="title-ru">Arc Science</div>
        <p class="say">Arc Science is a scientific harness and computational platform for designing biomolecules.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-01.png" alt="Stop 1" />
      <figcaption class="meta">
        <div class="stop-index">2 · t = 6.0s</div>
        <div class="title-en">Four projects on one shared base</div>
        <div class="title-ru">Четыре проекта на одной общей основе</div>
        <p class="say">Four projects stand on one shared base: Omniverso, Snoggo, RNAv-G and Arc Chemistry.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-02.png" alt="Stop 2" />
      <figcaption class="meta">
        <div class="stop-index">3 · t = 12.0s</div>
        <div class="title-en">The four workspaces</div>
        <div class="title-ru">Четыре рабочие области</div>
        <p class="say">The console links four workspaces with Cammut, Arc Kit and the 231-source library.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-03.png" alt="Stop 3" />
      <figcaption class="meta">
        <div class="stop-index">4 · t = 18.0s</div>
        <div class="title-en">One result from source to sentence</div>
        <div class="title-ru">Один результат от источника до фразы</div>
        <p class="say">PDB 1MEL shows camel VH with lysozyme at 2.5 A and 55 residue pairs.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-04.png" alt="Stop 4" />
      <figcaption class="meta">
        <div class="stop-index">5 · t = 24.0s</div>
        <div class="title-en">Omniverso and its target</div>
        <div class="title-ru">Omniverso и его мишень</div>
        <p class="say">In PDB 1MEL, 24 lysozyme residues and 18 nanobody residues form 55 residue pairs within 4.5 A.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-05.png" alt="Stop 5" />
      <figcaption class="meta">
        <div class="stop-index">6 · t = 30.0s</div>
        <div class="title-en">The loop that reaches into the target</div>
        <div class="title-ru">Петля в активном центре мишени</div>
        <p class="say">One half of the loop contacts the domain while the other half enters the active site of lysozyme.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-06.png" alt="Stop 6" />
      <figcaption class="meta">
        <div class="stop-index">7 · t = 36.0s</div>
        <div class="title-en">Inside the model</div>
        <div class="title-ru">Устройство модели</div>
        <p class="say">The autoencoder has 255,873,676 parameters and the denoiser has 153,102,091 parameters along a straight path.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-07.png" alt="Stop 7" />
      <figcaption class="meta">
        <div class="stop-index">8 · t = 42.0s</div>
        <div class="title-en">Snoggo</div>
        <div class="title-ru">Snoggo</div>
        <p class="say">Snoggo estimates binding free energy changes for beta-tubulin mutations.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-08.png" alt="Stop 8" />
      <figcaption class="meta">
        <div class="stop-index">9 · t = 48.0s</div>
        <div class="title-en">RNAv-G</div>
        <div class="title-ru">RNAv-G</div>
        <p class="say">RNAv-G describes viral capsid assembly and genome placement.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-09.png" alt="Stop 9" />
      <figcaption class="meta">
        <div class="stop-index">10 · t = 54.0s</div>
        <div class="title-en">Arc Chemistry</div>
        <div class="title-ru">Arc Chemistry</div>
        <p class="say">Arc Chemistry selects extractants to separate neodymium and praseodymium.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-10.png" alt="Stop 10" />
      <figcaption class="meta">
        <div class="stop-index">11 · t = 60.0s</div>
        <div class="title-en">How research is checked</div>
        <div class="title-ru">Проверка гипотез и отбор</div>
        <p class="say">The hypothesis tree prunes weak branches into a claim graph and the judge compares candidates.</p>
      </figcaption>
    </figure>
    <figure class="cell">
      <img src="stop-11.png" alt="Stop 11" />
      <figcaption class="meta">
        <div class="stop-index">12 · t = 66.0s</div>
        <div class="title-en">What we ask of Yandex Cloud</div>
        <div class="title-ru">Запрос к Yandex Cloud</div>
        <p class="say">We request 8,320 GPU-hours over 12 months in two stages: 2,080 h pilot and 6,240 h scale.</p>
      </figcaption>
    </figure>
  </div>
</body>
</html>
